# yaml-language-server: $schema=https://github.com/litebitus/go-publisher/releases/latest/download/go-publisher-v2.schema.json
version: 2

project_name: zerox

git:
  tag_prefix: v

before:
  hooks:
    - go -C client/go generate ./...
    - go run ./internal/schemaassets .schema-assets
    - mkdir -p completions
    - sh -c 'go run . completion bash > completions/zerox.bash'
    - sh -c 'go run . completion zsh > completions/zerox.zsh'
    - sh -c 'go run . completion fish > completions/zerox.fish'

builds:
  - id: zerox
    main: .
    binary: zerox
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: zerox
    repository:
      owner: litebitus
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/litebitus/zerox"
    description: "Renders a template set into a target folder"
    skip_upload: auto
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/zerox"]
        end
      end
    completions:
      bash: completions/zerox.bash
      zsh: completions/zerox.zsh
      fish: completions/zerox.fish

release:
  prerelease: auto
  extra_files:
    - glob: .schema-assets/*.schema.json
