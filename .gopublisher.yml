# yaml-language-server: $schema=https://github.com/litebitus/go-publisher/releases/latest/download/go-publisher-v2.schema.json
version: 2

project_name: zerox

git:
  tag_prefix: v

before:
  hooks:
    - go -C client/go generate ./...
    - go run ./internal/schemaassets .schema-assets

builds:
  - id: zerox
    main: .
    binary: zerox
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  prerelease: auto
  extra_files:
    - glob: .schema-assets/*.schema.json
